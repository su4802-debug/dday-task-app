<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>업무 진행 보고</title>
<style>
  :root{--bg:#f3f5f9;--card:#fff;--line:#e2e6ee;--text:#1b2333;--sub:#667085;--primary:#2563eb;--pw:#e8efff;
        --over:#d92d20;--soon:#e8590c;--ok:#15803d;--okw:#e7f6ec;--risk:#7c3aed}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 "Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  .top{display:flex;align-items:center;gap:8px;margin:4px 2px 12px;color:var(--sub);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px}
  h1{font-size:19px;margin:6px 0 4px;line-height:1.35}
  h2{font-size:15px;margin:0 0 10px}
  .desc{color:var(--sub);font-size:14px;white-space:pre-wrap}
  .dd{display:inline-block;padding:3px 10px;border-radius:99px;font-weight:800;font-size:13px;background:var(--okw);color:var(--ok)}
  .dd.soon{background:#fff0e6;color:var(--soon)} .dd.over{background:#fde8e6;color:var(--over)} .dd.done{background:#eef0f4;color:#7a8499}
  .hello{margin-top:12px;padding:10px 12px;background:var(--pw);border-radius:10px;font-size:14px}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .meta div{background:#f8f9fc;border-radius:10px;padding:9px 12px}
  .meta b{display:block;font-size:12px;color:var(--sub);font-weight:600}
  .meta span{font-weight:700}
  .team .m{display:grid;grid-template-columns:76px 1fr 46px;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f0f2f6}
  .team .m:last-child{border-bottom:0}
  .team .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .team .me .n{color:var(--primary)}
  .team .p{text-align:right;font-weight:700;font-size:14px}
  .team .s{font-size:12px;color:var(--sub);grid-column:2/4;margin-top:-6px}
  .bar{height:8px;background:#eef1f6;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--primary)}
  .bar i.ok{background:var(--ok)}
  label.l{display:block;font-weight:700;font-size:14px;margin:16px 0 8px}
  label.l:first-child{margin-top:0}
  .range{display:flex;align-items:center;gap:12px}
  .range input{flex:1;accent-color:var(--primary);height:28px}
  .range output{font-size:22px;font-weight:800;min-width:64px;text-align:right;color:var(--primary)}
  .quick{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .quick button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .seg label{border:1.5px solid var(--line);border-radius:10px;padding:11px 4px;text-align:center;cursor:pointer;font-weight:700;color:var(--sub)}
  .seg input{display:none}
  .seg label:has(input:checked){border-color:var(--primary);background:var(--pw);color:var(--primary)}
  .seg label.done:has(input:checked){border-color:var(--ok);background:var(--okw);color:var(--ok)}
  input[type=date],textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;background:#fff}
  textarea{min-height:120px;resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:var(--primary)}
  .hint{font-size:12.5px;color:var(--sub);margin-top:6px}
  .warn{color:var(--risk);font-weight:700}
  .submit{width:100%;border:0;background:var(--primary);color:#fff;font-weight:800;font-size:16px;padding:15px;border-radius:12px;margin-top:18px;cursor:pointer}
  .submit:disabled{opacity:.55}
  .item{border-left:3px solid var(--line);padding:2px 0 10px 12px;margin-left:4px}
  .item.mine{border-color:var(--primary)}
  .item .h{font-size:12.5px;color:var(--sub)}
  .item .c{white-space:pre-wrap;font-size:14px;margin-top:2px}
  .msg{text-align:center;padding:26px 10px}
  .msg .big{font-size:42px}
  .err{color:var(--over)}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1b2333;color:#fff;padding:11px 18px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
  .toast.show{opacity:1} .toast.e{background:var(--over)}
  .demo{background:#fff7d6;color:#7a5b00;text-align:center;padding:6px;font-size:12px}
  .testbar{background:#fef3c7;border:1px solid #fcd34d;color:#92400e;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13.5px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="config.js"></script>
</head>
<body>
<div class="demo" id="demo" hidden>미리보기 모드 — 샘플 업무로 표시됩니다 (저장 안 됨)</div>
<div class="wrap">
  <div class="top">📋 <span id="sender">업무알림</span> · 진행 현황 보고</div>
  <div id="app"><div class="card msg">불러오는 중…</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
const RTOKEN = (new URLSearchParams(location.search).get('r') || '').replace(/[^a-f0-9]/gi, '').slice(0, 64).toLowerCase();
const CFG = window.APP_CONFIG || {};
const HAS_GAS = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase);   // 실제 모드
const SB = HAS_GAS ? supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } }) : null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ddLabel = d => d === null || d === undefined ? '-' : d > 0 ? 'D-' + d : d === 0 ? 'D-DAY' : 'D+' + (-d);

function api(fn, ...args) {
  if (!HAS_GAS) return Demo[fn](...args);
  const p = fn === 'reportLoad' ? { p_token: args[0] }
    : { p_token: args[0], p_progress: Math.round(Number(args[1].progress) || 0), p_status: args[1].status,
        p_expected: args[1].expected || null, p_content: args[1].content };
  return SB.rpc(fn === 'reportLoad' ? 'report_load' : 'report_submit', p).then(r => {
    if (r.error) throw new Error(/Failed to fetch/i.test(r.error.message) ? '서버에 연결할 수 없습니다. 잠시 후 다시 시도하세요.' : r.error.message);
    return r.data;
  });
}
let tt;
function toast(m, e) { const t = $('#toast'); t.textContent = m; t.className = 'toast show' + (e ? ' e' : ''); clearTimeout(tt); tt = setTimeout(() => t.className = 'toast', 3200); }

function render(d) {
  const t = d.task, me = d.me, team = d.team || [];
  $('#sender').textContent = d.senderName || '업무알림';
  const meDone = me.status === '완료';
  const cls = t.status === '완료' ? 'done' : t.dday < 0 ? 'over' : t.dday <= 3 ? 'soon' : '';
  const multi = team.length > 1;
  let html = (d.isTest ? `<div class="testbar">🧪 <b>테스트 업무</b>입니다. 입력하면 실제 데이터로 기록되며, 관리자가 [테스트] 탭에서 초기화할 수 있습니다.</div>` : '') + `<div class="card">
    <span class="dd ${cls}">${t.status === '완료' ? '업무 완료' : ddLabel(t.dday)}</span>
    <h1>${esc(t.title)}</h1>
    ${t.desc ? `<div class="desc">${esc(t.desc)}</div>` : ''}
    <div class="hello"><b>${esc(me.name)}</b>님의 진행 보고 페이지입니다.${multi ? ' 이 업무는 <b>' + team.length + '명</b>이 함께 진행합니다.' : ''}</div>
    <div class="meta">
      <div><b>마감일</b><span>${esc(t.due)}</span></div>
      <div><b>내 진행률 / 상태</b><span>${me.progress}% · ${esc(me.status)}</span></div>
      ${multi ? `<div><b>전체 진행률</b><span>${t.progress}%</span></div><div><b>완료 인원</b><span>${team.filter(x => x.status === '완료').length} / ${team.length}명</span></div>` : ''}
    </div></div>`;

  if (multi) {
    html += `<div class="card team"><h2>👥 공동 작업자 현황</h2>` + team.map(w => `
      <div class="m ${w.me ? 'me' : ''}"><span class="n">${esc(w.name)}${w.me ? ' (나)' : ''}</span>
        <span class="bar"><i class="${w.status === '완료' ? 'ok' : ''}" style="width:${w.progress}%"></i></span><span class="p">${w.progress}%</span>
        <span class="s">${esc(w.status)}${w.expected ? ' · 예상 ' + esc(w.expected.slice(5)) : ''}${w.lastReportAt ? ' · 보고 ' + esc(w.lastReportAt.slice(5)) : ' · 보고 없음'}</span></div>`).join('') + `</div>`;
  }

  if (meDone) {
    html += `<div class="card msg"><div class="big">✅</div><b>내 작업을 완료 보고했습니다.</b><div class="hint">완료일 ${esc(me.doneDate || '')}${multi && t.status !== '완료' ? ' · 다른 작업자가 마치면 업무가 완료됩니다.' : ''}</div></div>`;
  } else {
    const st = me.status === '보류' ? '보류' : '진행중';
    html += `<form class="card" id="f" autocomplete="off">
      <h2>✏️ 내 진행 상황 입력</h2>
      <label class="l">진행률</label>
      <div class="range"><input type="range" name="progress" min="0" max="100" step="5" value="${me.progress}"><output id="po">${me.progress}%</output></div>
      <div class="quick">${[0, 25, 50, 75, 90].map(v => `<button type="button" data-p="${v}">${v}%</button>`).join('')}</div>
      <label class="l">상태</label>
      <div class="seg">
        <label><input type="radio" name="status" value="진행중" ${st === '진행중' ? 'checked' : ''}>진행중</label>
        <label><input type="radio" name="status" value="보류" ${st === '보류' ? 'checked' : ''}>보류</label>
        <label class="done"><input type="radio" name="status" value="완료">완료</label>
      </div>
      <label class="l">내 마감예상일</label>
      <input type="date" name="expected" value="${esc(me.expected || '')}">
      <div class="hint" id="eh"></div>
      <label class="l">진행 내용 <span class="err">*</span></label>
      <textarea name="content" maxlength="2000" placeholder="지금까지 한 일, 남은 일, 도움이 필요한 부분 등을 적어 주세요."></textarea>
      <button class="submit" id="sb">보고하기</button>
    </form>`;
  }

  if (d.reports && d.reports.length) {
    html += `<div class="card"><h2>최근 보고${multi ? ' (전체 작업자)' : ''}</h2>` + d.reports.map(r =>
      `<div class="item ${r.owner === me.name ? 'mine' : ''}"><div class="h">${esc(r.at)}${multi ? ' · <b>' + esc(r.owner) + '</b>' : ''} · ${r.prevProgress}% → <b>${r.progress}%</b> · ${esc(r.status)}${r.expected ? ' · 예상 ' + esc(r.expected) : ''}</div>
       <div class="c">${esc(r.content)}</div></div>`).join('') + `</div>`;
  }
  $('#app').innerHTML = html;
  if (!meDone) bind(t);
}

function bind(t) {
  const f = $('#f'), po = $('#po');
  const sync = () => {
    po.textContent = f.progress.value + '%';
    const exp = f.expected.value;
    $('#eh').innerHTML = exp && exp > t.due ? '<span class="warn">▲ 마감일보다 늦어집니다. 사유를 진행 내용에 적어 주세요.</span>'
      : `마감일 ${esc(t.due)}까지 끝내기 어렵다면 예상일을 바꿔 주세요.`;
  };
  f.addEventListener('input', e => {
    if (e.target.name === 'status' && e.target.value === '완료') f.progress.value = 100;
    if (e.target.name === 'progress' && f.status.value === '완료' && +f.progress.value < 100) f.querySelector('[value=진행중]').checked = true;
    sync();
  });
  f.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { f.progress.value = b.dataset.p; sync(); });
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const data = { progress: f.progress.value, status: f.status.value, expected: f.expected.value, content: f.content.value.trim() };
    if (!data.content.length) { toast('진행 내용을 입력하세요.', true); f.content.focus(); return; }
    if (data.status === '완료' && !confirm('완료로 보고하면 내 알림이 중지됩니다. 완료 보고할까요?')) return;
    $('#sb').disabled = true; $('#sb').textContent = '보내는 중…';
    try {
      render(await api('reportSubmit', RTOKEN, data));
      toast(data.status === '완료' ? '완료 보고가 접수되었습니다. 수고하셨습니다!' : '보고가 접수되었습니다. 감사합니다.');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) {
      toast(err.message || String(err), true);
      $('#sb').disabled = false; $('#sb').textContent = '보고하기';
    }
  });
  sync();
}

/* 미리보기 (config.js 설정 전) */
const Demo = (() => {
  const add = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
  const d = { senderName: '업무알림',
    task: { title: '4분기 부가세 신고 자료 취합', desc: '매입·매출 세금계산서 대사 후 세무사 전달', due: add(2), dday: 2, progress: 53, status: '진행중' },
    me: { name: '김민수', progress: 60, status: '진행중', expected: add(3) },
    team: [{ name: '김민수', progress: 60, status: '진행중', expected: add(3), lastReportAt: add(-3) + ' 17:40', me: true },
           { name: '이지은', progress: 100, status: '완료', expected: add(1), lastReportAt: add(-1) + ' 10:05' },
           { name: '박준호', progress: 0, status: '대기', expected: '', lastReportAt: '' }],
    reports: [{ at: add(-1) + ' 10:05', owner: '이지은', prevProgress: 70, progress: 100, status: '완료', expected: add(1), content: '매출분 세금계산서 대사 완료했습니다.' },
              { at: add(-3) + ' 17:40', owner: '김민수', prevProgress: 30, progress: 60, status: '진행중', expected: add(3), content: '매입 세금계산서 대사 완료. 증빙 정리는 내일 진행 예정입니다.' }] };
  const recalc = () => { d.task.progress = Math.round(d.team.reduce((s, w) => s + w.progress, 0) / d.team.length); };
  return {
    reportLoad: () => new Promise(r => setTimeout(() => r(JSON.parse(JSON.stringify(d))), 200)),
    reportSubmit: (_, x) => new Promise(r => setTimeout(() => {
      d.reports.unshift({ at: new Date().toISOString().slice(0, 16).replace('T', ' '), owner: d.me.name, prevProgress: d.me.progress, progress: +x.progress, status: x.status, expected: x.expected, content: x.content });
      Object.assign(d.me, { progress: +x.progress, status: x.status, expected: x.expected, doneDate: x.status === '완료' ? add(0) : '' });
      Object.assign(d.team[0], { progress: +x.progress, status: x.status, expected: x.expected, lastReportAt: add(0) + ' 지금' });
      recalc(); r(JSON.parse(JSON.stringify(d)));
    }, 300))
  };
})();

(async function init() {
  if (!HAS_GAS) $('#demo').hidden = false;
  else if (!RTOKEN) { $('#app').innerHTML = `<div class="card msg"><div class="big">🔗</div><b class="err">보고 링크가 올바르지 않습니다.</b><br>받은 메일·카톡의 링크를 다시 눌러 주세요.</div>`; return; }
  try { render(await api('reportLoad', RTOKEN)); }
  catch (e) { $('#app').innerHTML = `<div class="card msg"><div class="big">⚠️</div><b class="err">${esc(e.message || e)}</b></div>`; }
})();
</script>
</body>
</html>
